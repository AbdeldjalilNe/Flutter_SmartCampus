name: smartcampus_companion
description: A comprehensive university campus mobile app demonstrating mobile OS concepts

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Device Features
  local_auth: ^2.1.8
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.0
  image_picker: ^1.0.7
  permission_handler: ^11.1.0
  sensors_plus: ^4.0.2
  
  # Notifications & Background
  flutter_local_notifications: ^17.2.0
  workmanager: ^0.9.0
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Internationalization
  intl: ^0.20.2
  
  # UI Components
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  table_calendar: ^3.0.9
  
  # Security
  crypto: ^3.0.3
  
  # Utils
  uuid: ^4.2.1
  logger: ^2.0.2+1
  dartz: ^0.10.1
  get_it: ^7.6.4
  injectable: ^2.3.2
  mobile_scanner: ^7.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1
  mockito: ^5.4.4
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/lang/
    - assets/map_styles/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
